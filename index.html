<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net https://bauval.org; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; media-src https: blob:; connect-src 'self' https://bauval.org https://inference.dahl.global https://open.er-api.com; frame-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Umrani — an intelligent AI assistant for Urdu, Roman Urdu and English." />
  <title>Umrani</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles/main.css?v=63" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/umrani-mark.svg?v=55" />
</head>
<body class="sidebar-expanded">

  <!-- Loading screen shown while the fastest AI model is tested. -->
  <div class="model-loading" id="modelLoadingOverlay" role="status" aria-live="polite">
    <div class="model-loading-card">
      <div class="model-loading-logo" aria-hidden="true">
        <svg data-icon="brand" class="ui-icon" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.75 5.5v7a5.25 5.25 0 0 0 10.5 0v-7"/><path d="m19 2.75.65 1.85 1.85.65-1.85.65L19 7.75l-.65-1.85-1.85-.65 1.85-.65L19 2.75Z" fill="currentColor" stroke="none"/></svg>
      </div>
      <p class="model-loading-title">Umrani</p>
      <div class="model-loading-bar" aria-hidden="true">
        <div class="model-loading-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- ======================= SIDEBAR ======================= -->
  <aside class="sidebar" id="sidebar" aria-label="Chat navigation">
    <div class="sidebar-head">
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close menu">
        <svg data-icon="menu" class="ui-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15M5.75 8h1"/></svg>
      </button>
      <button type="button" class="brand" id="brandHome" aria-label="Umrani AI home">
        <span class="brand-mark" aria-hidden="true">
          <svg data-icon="brand" class="ui-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.75 5.5v7a5.25 5.25 0 0 0 10.5 0v-7"/><path d="m19 2.75.65 1.85 1.85.65-1.85.65L19 7.75l-.65-1.85-1.85-.65 1.85-.65L19 2.75Z" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="brand-name">Umrani AI</span>
      </button>

    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg data-icon="plus" class="ui-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>

    <div class="search-wrap">
      <svg data-icon="search" class="ui-icon search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="10.75" cy="10.75" r="6.25"/><path d="m15.25 15.25 4.25 4.25"/></svg>
      <input type="search" id="searchChats" placeholder="Search chats" aria-label="Search chats" autocomplete="off" />
    </div>

    <nav class="chat-list" id="chatList" aria-label="Chat history">
      <!-- Chat items rendered by app.js -->
    </nav>
  </aside>

  <div class="overlay" id="overlay" hidden></div>
  <!-- ======================= MAIN ======================= -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <svg data-icon="menu" class="ui-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15M5.75 8h1"/></svg>
      </button>
      <span class="topbar-title">Umrani AI</span>
    </header>

    <!--
      ADSTERRA NATIVE BANNER
      ----------------------
      1. The third-party script renders the advertisement inside this shell.
      2. The × button is controlled by src/ui/ads.js.
      3. Clicking × only hides this shell for the current session; it does not
         lock the composer, and the next chat simply shows a fresh ad.
    -->
    <section class="adsterra-ad-shell" id="adsterraAdShell" aria-label="Advertisement" hidden>
      <span class="adsterra-ad-label">Advertisement</span>
      <p id="adDeliveryStatus" class="ad-delivery-status" role="status">Loading advertisement…</p>
      <button class="adsterra-close-btn" id="adsterraCloseButton"
              type="button" aria-label="Close advertisement" title="Close advertisement"><svg data-icon="close" class="ui-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6.5 6.5 11 11m0-11-11 11"/></svg></button>
      <!-- Native Banner script is injected only after this shell is visible.
           The container and rendered creative are preserved across chat rerenders. -->
      <div class="native-ad-container"
           id="container-63ea484e1a293480518c8d527b5e81e3"></div>
    </section>

    <main class="chat-area" id="chatArea" aria-live="polite">
      <div class="messages" id="messages"></div>

      <!-- Empty / welcome state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-logo" aria-hidden="true">
          <svg data-icon="brand" class="ui-icon" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.75 5.5v7a5.25 5.25 0 0 0 10.5 0v-7"/><path d="m19 2.75.65 1.85 1.85.65-1.85.65L19 7.75l-.65-1.85-1.85-.65 1.85-.65L19 2.75Z" fill="currentColor" stroke="none"/></svg>
        </div>
        <h1>Umrani</h1>
        <p class="empty-sub">How can I help you today?</p>
        <p class="empty-lang">Ask me anything.</p>
      </div>
    </main>

    <!-- ======================= COMPOSER ======================= -->
    <div class="composer-zone">
      <div class="attachment-bar" id="attachmentBar" hidden>
        <span class="attachment-name" id="attachmentName"></span>
        <button class="attachment-remove" id="attachmentRemoveBtn"
                type="button" aria-label="Remove attached file"><svg data-icon="close" class="ui-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6.5 6.5 11 11m0-11-11 11"/></svg></button>
      </div>
      <div class="stream-status" id="streamStatus" hidden>
        <span class="dot" aria-hidden="true"></span> Generating…
      </div>
      <div class="composer" id="composer">
        <button class="icon-btn composer-attach" id="attachBtn"
                type="button" aria-label="Attach text or code file" title="Attach text or code file">
          <svg data-icon="plus" class="ui-icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="messageInput" rows="1" placeholder="Write a message…" aria-label="Message"></textarea>
        <div class="composer-actions">
          <input id="fileInput" type="file" hidden
               accept=".txt,.md,.markdown,.csv,.json,.xml,.html,.htm,.css,.js,.mjs,.cjs,.ts,.tsx,.jsx,.py,.java,.c,.h,.cpp,.cc,.cxx,.hpp,.cs,.php,.rb,.go,.rs,.swift,.kt,.kts,.sql,.sh,.bash,.ps1,.yml,.yaml,.svg,.vue,.svelte,.dart,.lua,.pl,.r,.ini,.toml,.log,text/*,application/json,application/xml" />
          <button class="icon-btn composer-mic" id="micBtn" aria-label="Voice input">
          <svg data-icon="mic" class="ui-icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4m-3 0h6"/></svg>
        </button>
          <button class="stop-btn" id="stopBtn" aria-label="Stop generating" title="Stop generating" hidden>
          <svg data-icon="stop" class="ui-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"/></svg>
        </button>
          <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg data-icon="send" class="ui-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
        </button>
        </div>
      </div>
      <div class="composer-footer">
        <p class="composer-hint">Umrani can make mistakes. Check important info.</p>
        <div class="composer-meta">
        <span class="composer-model" id="composerModelLabel">Umrani 2.1</span>
        <button class="deep-think-toggle" id="deepThinkToggle" type="button" aria-pressed="false"><svg data-icon="brain" class="ui-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5a3 3 0 0 0-5.8-1 3.5 3.5 0 0 0-2 6 4 4 0 0 0 1 7.5A3.5 3.5 0 0 0 12 19V5Zm0 0a3 3 0 0 1 5.8-1 3.5 3.5 0 0 1 2 6 4 4 0 0 1-1 7.5A3.5 3.5 0 0 1 12 19M8 7a3 3 0 0 1-1 3m-1 4a3 3 0 0 1 3 3m7-10a3 3 0 0 0 1 3m1 4a3 3 0 0 0-3 3"/></svg><span class="icon-label">Deep Think</span></button>
      </div>
      </div>
    </div>
  </div>

  <!-- ======================= ABOUT DEVELOPER =======================
       Fixed top-right pill, visible on desktop and mobile
       (icon-only on small screens). Exactly ONE developer button. -->
  <a class="about-developer-top" id="aboutDeveloperBtn"
     href="https://fahadumrani.devs.li/" target="_blank" rel="noopener noreferrer"
     aria-label="About Developer" title="About Developer">
    <span class="developer-icon" aria-hidden="true">
      <svg data-icon="developer" class="ui-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="7.5" r="3.25"/><path d="M5 20v-1a7 7 0 0 1 14 0v1"/></svg>
    </span>
    <span class="developer-label">About Developer</span>
  </a>

  <!-- Toast notifications -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- KaTeX for math rendering (formulas and derivations). -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js" integrity="sha384-qJNkHwhlYywDHfyoEe1np+1lYvX/8x+3gHCKFhSSBMQyCFlvFnn+zXmaebXl21rV" crossorigin="anonymous"></script>
  <!-- Mermaid for rendering graphs/diagrams as real visuals. -->
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" integrity="sha384-WmdflGW9aGfoBdHc4rRyWzYuAjEmDwMdGdiPNacbwfGKxBW/SO6guzuQ76qjnSlr" crossorigin="anonymous"></script>
  <!-- Bundled classic script: uses browser-side API credentials as explicitly requested. -->
  <script defer src="dist/app.bundle.js?v=63"></script>
</body>
</html>
